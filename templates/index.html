<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <h2 class="text-center mb-4">Task & Server Checklist</h2>
        <form action="/add" method="POST" class="input-group mb-4">
            <input type="text" name="title" class="form-control" placeholder="Enter task..." required>
            <button class="btn btn-primary" type="submit">Add Task</button>
        </form>
        <ul class="list-group shadow-sm">
            {% for id, title, status in tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span class="{{ 'text-decoration-line-through text-muted' if status == 'Completed' else '' }}">
                    {{ title }}
                </span>
                <a href="/toggle/{{ id }}" class="btn btn-sm {{ 'btn-secondary' if status == 'Completed' else 'btn-success' }}">
                    {{ 'Undo' if status == 'Completed' else 'Done' }}
                </a>
            </li>
            {% else %}
            <li class="list-group-item text-center text-muted">No tasks added yet.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
